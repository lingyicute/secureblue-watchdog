name: secureblue update watch

on:
  push:
  schedule:
    - cron: '20 * * * *'
  workflow_dispatch:
    inputs:
      image:
        description: "ghcr repo (namespace/name)"
        default: "secureblue/silverblue-main-hardened"
        required: false
      arch:
        description: "architecture"
        default: "amd64"
        type: choice
        options: [amd64, arm64]
      from_tag:
        description: "compare against this tag instead of the last seen image (e.g. 20260916)"
        required: false
        default: ""
      force:
        description: "re-analyse even if the digest did not change"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  actions: write        # needed only by the "prune old caches" step

env:
  SB_IMAGE: ${{ inputs.image || 'secureblue/silverblue-main-hardened' }}
  SB_ARCH: ${{ inputs.arch || 'amd64' }}
  SB_FROM: ${{ inputs.from_tag }}
  # Both switches are repository *variables* (Settings -> Secrets and variables ->
  # Actions -> Variables) so they can actually be turned on without editing this
  # file. They used to be hard-coded "false" here, which made the Telegram step
  # and the red-run step unreachable no matter what the README promised.
  POST_SKIP_VERDICT: ${{ vars.POST_SKIP_VERDICT || 'false' }}
  FAIL_ON_SECURITY: ${{ vars.FAIL_ON_SECURITY || 'false' }}
  # Job-level, so that a step-level `if: env.X != ''` can see it. A step-level env
  # entry is not in scope for that step's own `if:` - that is why the Telegram
  # push never fired before.
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

concurrency:
  group: sbwatch-${{ inputs.image || 'secureblue/silverblue-main-hardened' }}-${{ inputs.arch || 'amd64' }}
  cancel-in-progress: false

jobs:
  test:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # Offline: 86 tests, no registry or Bodhi access (the build-history test
      # stubs list_tags, so nothing here touches the network). NOTE: the watch
      # job runs independently of this one - a regression in rpmvercmp /
      # classify_change shows up here but does NOT block the hourly watch.
      - name: Run the offline test suite
        run: python3 -m unittest discover -s tests -v

      - name: Lint (dead imports / undefined names)
        run: |
          python3 -m pip install --quiet pyflakes
          python3 -m pyflakes sbwatch.py tests/test_sbwatch.py

  watch:
    name: Update watch
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install cosign
        # Pinned by commit SHA, not by tag: the `# pin:` comment next to a mutable
        # tag documents an intention it does not enforce.
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: 'v2.4.1'

      - name: Download secureblue cosign.pub
        run: |
          set -euo pipefail
          curl -fsSL -o cosign.pub https://raw.githubusercontent.com/secureblue/secureblue/live/cosign.pub
          ls -l cosign.pub
          # The key must be the ECDSA P-256 one secureblue publishes; a truncated or
          # replaced file should fail here rather than at verification time.
          head -1 cosign.pub | grep -q 'BEGIN PUBLIC KEY'

      - name: Derive a cache namespace from the image name
        id: ns
        run: |
          # cache keys allow only alphanumerics, '-' and '_', and SB_IMAGE has a '/'
          ns=$(printf '%s' "$SB_IMAGE" | tr -c 'A-Za-z0-9' '-' | tr -s '-' | sed 's/^-*//;s/-*$//')
          echo "ns=$ns" >> "$GITHUB_OUTPUT"

      - name: Restore sbwatch cache (package lists per image, Bodhi answers, last digest)
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/sbwatch
          # Scoped per image *and* arch: a shared prefix let an amd64 run evict the
          # arm64 entry and vice versa, and evicting state.json is not harmless -
          # without it `check` has no baseline and falls back to scanning history.
          # run_attempt is part of the key so that RE-running a workflow run (same
          # run_id) does not hit "Cache already exists" and fail the save step.
          key: sbwatch-${{ steps.ns.outputs.ns }}-${{ env.SB_ARCH }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            sbwatch-${{ steps.ns.outputs.ns }}-${{ env.SB_ARCH }}-

      - name: Analyse the newest build
        id: check
        run: |
          set -uo pipefail
          args=(--image "$SB_IMAGE" --arch "$SB_ARCH" --max-bodhi 80 --report report.md)
          [ -n "${SB_FROM:-}" ] && args+=(--a "$SB_FROM")
          [ "${{ inputs.force }}" = "true" ] && args+=(--force)
          if [ -f cosign.pub ]; then
            args+=(--cosign-pub cosign.pub --require-cosign)
          fi
          # Ask sbwatch to signal "security fixes waiting" as exit code 10. Without
          # this flag the rc=10 branch below was dead code.
          [ "$FAIL_ON_SECURITY" = "true" ] && args+=(--fail-on security)
          rc=0
          python3 sbwatch.py check "${args[@]}" || rc=$?
          # 0 = ok, 10 = "fail-on security" tripped: neither is an error here
          if [ "$rc" != 0 ] && [ "$rc" != 10 ]; then
            echo "sbwatch exited $rc"
            exit "$rc"
          fi
          echo 'sbwatch exit code: '"$rc"
          echo "fail_on_security=$([ "$rc" = 10 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          [ -f report.md ] && cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Save sbwatch cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/sbwatch
          key: sbwatch-${{ steps.ns.outputs.ns }}-${{ env.SB_ARCH }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Prune old sbwatch caches
        if: always()
        uses: actions/github-script@v7
        env:
          NS: ${{ steps.ns.outputs.ns }}
        with:
          script: |
            // Must be the SAME prefix the cache keys actually start with:
            // sbwatch-<ns>-<arch>-<run_id>-<run_attempt>. The previous
            // `sbwatch-${SB_ARCH}` never matched any key (the image namespace
            // sits between), so this step silently pruned nothing while still
            // reporting success.
            const prefix = `sbwatch-${process.env.NS}-${process.env.SB_ARCH}-`;
            const keep = 7;                                  // newest entries to keep
            const res = await github.rest.actions.getActionsCacheList({
              owner: context.repo.owner, repo: context.repo.repo,
              per_page: 100, key: prefix,
              sort: 'last_accessed_at', direction: 'desc',
            });
            const caches = (res.data.actions_caches || []).slice(keep);
            for (const c of caches) {
              await github.rest.actions.deleteActionsCacheById({
                owner: context.repo.owner, repo: context.repo.repo, cache_id: c.id,
              });
              core.info(`deleted cache ${c.id} (${c.key})`);
            }
            core.info(`pruned ${caches.length} old cache entr(ies), kept ${keep}`);

      - name: Append build history (several pushes a day share one version string)
        if: steps.check.outputs.verdict != 'no-update' && steps.check.outputs.verdict != 'no-change' && steps.check.outputs.verdict != '' && steps.check.outputs.verdict != 'unknown'
        run: |
          {
            echo ""
            echo "## Builds in this repo, newest last"
            echo '```'
            python3 sbwatch.py history --image "$SB_IMAGE" --arch "$SB_ARCH" \
              --scan 10 --days 7 2>&1 || echo "(history scan failed)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # NOTE: deliberately NOT the same condition as the history step above:
      # this one also runs for 'no-change' - a no-change run produces a real
      # report worth keeping as an artifact, while re-listing the build history
      # for it adds nothing.
      - name: Upload report
        uses: actions/upload-artifact@v4
        if: always() && steps.check.outputs.verdict != 'no-update' && steps.check.outputs.verdict != '' && steps.check.outputs.verdict != 'unknown'
        with:
          name: update-watch-${{ github.run_number }}
          path: |
            report.md
            report.md.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Should we notify?
        id: notify
        run: |
          verdict="${{ steps.check.outputs.verdict }}"
          post=true
          # silent when nothing changed: no-update, no-change, unknown, empty
          if [ "$verdict" = "no-update" ] || [ "$verdict" = "no-change" ] || [ "$verdict" = "unknown" ] || [ -z "$verdict" ]; then post=false; fi
          if [ "$verdict" = "skip" ] && [ "$POST_SKIP_VERDICT" != "true" ]; then post=false; fi
          {
            echo "post=$post"
            echo "verdict=$verdict"
          } >> "$GITHUB_OUTPUT"
          echo "verdict=$verdict post=$post post_skip=$POST_SKIP_VERDICT fail_on_security=$FAIL_ON_SECURITY"

      - name: Comment on (or open) a sticky issue
        if: steps.notify.outputs.post == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="secureblue update watch"
          {
            printf '> 🤖 update-watch · %s · verdict: **%s**\n\n' "$(date -u +%F)" "${{ steps.notify.outputs.verdict }}"
            if [ -f report.md ]; then cat report.md; else echo "_no report_"; fi
          } > body.md
          num=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
                  --search "in:title $title" --json number --jq '.[0].number // empty')
          if [ -n "$num" ]; then
            gh issue comment "$num" --repo "$GITHUB_REPOSITORY" --body-file body.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file body.md \
              --label update-watch 2>/dev/null ||
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file body.md
          fi

      - name: Push to Telegram
        # env.TELEGRAM_BOT_TOKEN is defined at *job* level, so it is visible here.
        if: steps.notify.outputs.post == 'true' && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        env:
          SUMMARY: ${{ steps.check.outputs.summary }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, sys
          try:
              body = open("report.md").read()[:3500]
          except FileNotFoundError:
              body = "(no report)"
          text = (os.environ.get("SUMMARY") or "secureblue update") + "\n\n" + body
          try:
              req = urllib.request.Request(
                  "https://api.telegram.org/bot{}/sendMessage".format(os.environ["TELEGRAM_BOT_TOKEN"]),
                  data=json.dumps({"chat_id": os.environ["TELEGRAM_CHAT_ID"], "text": text,
                                   "disable_web_page_preview": True}).encode(),
                  headers={"Content-Type": "application/json"})
              print(urllib.request.urlopen(req, timeout=30).read()[:150].decode())
          except Exception as e:
              print(f"Telegram push failed (non-fatal): {e}", file=sys.stderr)
          PY

      - name: Red run when security fixes are waiting
        if: env.FAIL_ON_SECURITY == 'true' && steps.check.outputs.fail_on_security == 'true'
        run: |
          echo "::error::new image has security fixes -> rpm-ostree upgrade && systemctl reboot"
          exit 10
